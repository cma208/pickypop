<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>Pickypop</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <script>
    /* Apply the saved appearance before the app paints. Without this the page
       renders light and then flips to dark, which reads as a bug. Must stay in
       step with core/appearance.ts. */
    try {
      var saved = JSON.parse(localStorage.getItem('pickypop.appearance') || '{}');
      if (saved.theme === 'light' || saved.theme === 'dark') {
        document.documentElement.dataset.theme = saved.theme;
      }
      if (saved.density === 'compact' || saved.density === 'comfortable') {
        document.documentElement.dataset.density = saved.density;
      }
    } catch (e) {
      /* Storage blocked: the defaults are fine. */
    }
  </script>
</head>
<body>
  <app-root></app-root>
</body>
</html>
